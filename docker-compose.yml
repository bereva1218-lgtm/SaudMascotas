services:
  backend:
    build:
      context: ./backend
    command: sh -c "npm install && npx prisma migrate deploy && npx prisma generate && npm run dev"
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=4000
      - JWT_SECRET=supersecret
    volumes:
      - ./backend:/app
      - ./backend/prisma:/app/prisma
      - backend_node_modules:/app/node_modules

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "if [ ! -x node_modules/.bin/vite ]; then npm install; fi; npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "8080:5173"
    environment:
      - VITE_API_URL=http://127.0.0.1:4000
    volumes:
      - ./Frontend/idea-to-interface-main:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
