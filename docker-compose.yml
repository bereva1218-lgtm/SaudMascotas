version: "3.9"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - JWT_SECRET=supersecret

  frontend:
    build:
      context: ./idea-to-interface-main/idea-to-interface-main
      args:
        VITE_API_URL: http://backend:4000
    ports:
      - "9100:80"
    depends_on:
      - backend

